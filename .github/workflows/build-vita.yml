name: Build PS Vita VPK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      # LiveArea PNGs must be 8-bit indexed, non-interlaced, and Vita-sized.
      - name: Prepare Vita LiveArea images
        run: |
          apt-get update
          apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import struct

          def save_indexed(source, destination, size):
              im = Image.open(source).convert("RGB")
              im = ImageOps.fit(im, size, method=Image.Resampling.LANCZOS)
              im = im.quantize(colors=64, method=Image.Quantize.MEDIANCUT)
              im.save(destination, format="PNG", optimize=True, compress_level=9, bits=8)
              data = Path(destination).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              width, height, depth, color_type = struct.unpack(">IIBB", data[16:26])
              assert (width, height) == size, (destination, width, height)
              assert depth == 8 and color_type == 3, (destination, depth, color_type)
              assert len(data) <= 512 * 1024, (destination, len(data))
              print(f"{destination}: {width}x{height}, 8-bit indexed, {len(data)} bytes")

          save_indexed("sce_sys/icon0.png", "sce_sys/icon0.png", (128, 128))
          save_indexed(
              "sce_sys/livearea/contents/bg.png",
              "sce_sys/livearea/contents/bg0.png",
              (840, 500),
          )
          PY

      # Build a reproducible modern vitaGL stack. Pin all source revisions so
      # upstream changes cannot silently break the CI build.
      - name: Build Vita graphics dependencies
        run: |
          export PATH="$VITASDK/bin:$PATH"
          vdpm install taihen

          git clone https://github.com/bythos14/SceShaccCgExt.git /tmp/SceShaccCgExt
          git -C /tmp/SceShaccCgExt checkout fb0e9d338525b067f3679ab33571323336493cca
          cmake -S /tmp/SceShaccCgExt -B /tmp/SceShaccCgExt/build \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_STANDARD=17 -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_C_EXTENSIONS=ON
          cmake --build /tmp/SceShaccCgExt/build --parallel
          cmake --install /tmp/SceShaccCgExt/build --prefix "$VITASDK/arm-vita-eabi"

          git clone https://github.com/Rinnegatamante/math-neon.git /tmp/math-neon
          git -C /tmp/math-neon checkout 0faab814782c071ff4015527f1ca955ab1ccc470
          make -C /tmp/math-neon --jobs install

          git clone https://github.com/Rinnegatamante/vitaShaRK.git /tmp/vitaShaRK
          git -C /tmp/vitaShaRK checkout df24065e65098b2d1ac533760109ad4367573f28
          make -C /tmp/vitaShaRK --jobs install

          git clone https://github.com/Rinnegatamante/vitaGL.git /tmp/vitaGL
          git -C /tmp/vitaGL checkout dca4b9d143290d78ec043131a19be36c78cdc7b5
          make -C /tmp/vitaGL --jobs HAVE_SBRK=1 NO_SPLASHSCREEN=1 install

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: NewChaos-VPK
          path: build/NewChaos.vpk
